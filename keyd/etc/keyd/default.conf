[global]
overload_tap_timeout = 10000
[ids]

*

#logitech mouse
046d:c547

[main]
capslock = overload(meta, esc)
mouse2 = overload(meta, mouse2)
numlock = capslock

s = overloadt(symbols, s, 200)
f = overloadt(navi, f, 200)
a = overloadt(alt, a, 200)

[navi]
h = left
j = down
k = up
l = right

; = backspace
' = delete

[navi+shift]
h = home
l = end
j = pagedown
k = pageup
; = C-backspace

[symbols]
p = +
e = =
u = _
d = -
b = \
l = |
o = (
p = )

