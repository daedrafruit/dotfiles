#monitor = name, resolution, position, scale
monitor = eDP-1, 1920x1080@60, 0x0, 1
#monitor = eDP-1, disable
#monitor = , 1920x1080@240, 1920x0, 1
monitor = HDMI-A-1, 1920x1080@60, -1920x0, 1
#monitor = HDMI-A-1, 1366x768@60hz, 12920x0, 1
#monitor = HDMI-A-1, disable

workspace = 2, monitor:eDP-1, default:true
workspace = 4, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 10, monitor:eDP-1

workspace = 1, monitor:HDMI-A-1, default:true
workspace = 3, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1

$terminal = kitty
$fileManager = doublecmd
$powermenu = pkill wofi || ~/.config/wofi/scripts/powermenu.sh 
$menu = pkill wofi || wofi -I --show=drun 

#windowrule = float, ^(wofi)$
windowrulev2 = rounding 20, class:wofi

#
# Use `hyprctl clients` to find class
#
windowrulev2 = float, class:doublecmd
windowrulev2 = size 50% 55%, class:doublecmd

#windowrule = float, ^(Volume Control)$
windowrulev2 = float, title:Volume Control
windowrulev2 = plugin:hyprbars:nobar, title:Volume Control
windowrulev2 = size 49% 50%, title:Volume Control
windowrulev2 = move 50.5% 3.5%, title:Volume Control

windowrulev2 = float, class:org.gnome.FileRoller

#windowrule = float, ^(xarchiver)$
#windowrule = size 50% 50%, ^(xarchiver)$

windowrule = size 50% 50%, class:kitty

#windowrule = float, ^(xarchiver)$
#windowrule = size 50% 50%, ^(xarchiver)$

#windowrule = float, ^(blueman-manager)$
#windowrule = size 35% 50%, ^(blueman-manager)$

#remove animation for slurp selection
layerrule=noanim,selection

exec-once = GTK_THEME=Adwaita waybar
exec-once = tmux new-session -d 
exec-once = hyprpaper

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,catppuccin-mocha


general { 
	gaps_in = 3
	gaps_out = 10

	border_size = 2

	col.active_border = rgba(45475a55) 
	col.inactive_border = rgba(1e1e2e55)
	resize_on_border = true

	allow_tearing = false

	layout = dwindle
}

decoration {
	rounding = 8


	active_opacity = 1
	inactive_opacity = 1
	dim_inactive = true
	dim_strength = 0.15

	shadow {
		enabled = true
		range = 20
		render_power = 4
		color = rgba(00000099)
	}

	#windowrule = opacity 1 1, obsidian

	blur {
		enabled = true
		size = 3
		passes = 1
		
		vibrancy = 0.1696

		#windowrule = noblur, kitty

		#enable if wofi is has normal_window = false
		#layerrule = blur, wofi

		layerrule = ignorealpha 0.2, swaync 
		layerrule = blur, swaync

		layerrule = blur, waybar
		layerrule = blurpopups, waybar
		# Make it so transparent parts are ignored
		layerrule = ignorealpha 0.2, waybar 
	}
}

animations {
	enabled = true
	first_launch_animation = true

	bezier = myBezier, 0.05, 0.9, 0.1, 1.05

						# 							ONOFF	SPEED CURVE 	 STYLE 
  animation = windows, 			1, 		7, 		myBezier
	animation = windowsOut, 	1, 		7, 		default, popin 80%
	animation = border, 			0, 		10, 	default
	animation = borderangle, 	0, 		8, 		default
	animation = fade, 				1, 		7, 		default
	animation = workspaces, 	0,  	2, 		default
}

input {
	kb_layout = us
	kb_variant =
	kb_model =
	kb_options =
	kb_rules =

	follow_mouse = 1

	#	sensitivity = -0.5

	touchpad {
		natural_scroll = true
		scroll_factor = 0.3
		disable_while_typing = false
	}
}

dwindle {
	pseudotile = true
	preserve_split = true
}

master {
	new_status = master
}


gestures {
	workspace_swipe = true
}

cursor {
    no_hardware_cursors = true
}

misc {
	disable_splash_rendering = true
	disable_hyprland_logo = true
}

plugin {
    hyprbars {
			enabled = true
			bar_height = 18
			bar_blur = true
			bar_color = rgba(0b0b12a0)
			bar_title_enabled = true
			col.text = rgb(cdd6f4)
			bar_text_font = JetBrainsMono NF SemiBold
			bar_text_size = 10
			icon_on_hover = true
			bar_button_padding = 1
			hyprbars-button = rgba(00000000), 18, 󰖭, hyprctl dispatch killactive,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 18, , hyprctl dispatch togglefloating,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 18, , hyprctl dispatch movetoworkspacesilent 10,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰭂, hyprctl dispatch movetoworkspacesilent 9,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰭁, hyprctl dispatch movetoworkspacesilent 8,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰭀, hyprctl dispatch movetoworkspacesilent 7,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰬿, hyprctl dispatch movetoworkspacesilent 6,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰬾, hyprctl dispatch movetoworkspacesilent 5,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰬽, hyprctl dispatch movetoworkspacesilent 4,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰬼, hyprctl dispatch movetoworkspacesilent 3,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰬻, hyprctl dispatch movetoworkspacesilent 2,rgb(cdd6f4)
			hyprbars-button = rgba(00000000), 12, 󰬺, hyprctl dispatch movetoworkspacesilent 1,rgb(cdd6f4)
			# 󰇏 󰇎 󰇍 󰇌 󰇋 󰇊

			windowrulev2 = plugin:hyprbars:nobar, class:wofi
			windowrulev2 = plugin:hyprbars:bar_color rgba(0b0b12d0), focus:0

			#bar_color
			#bar_text_align
			#bar_buttons_alignment
			#bar_part_of_window
			#bar_precedence_over_border
			#bar_padding
			#hyprbars-button = bgcolor, size, icon, on-click, fgcolor
			#plugin:hyprbars:nobar
			#plugin:hyprbars:bar_color
			#plugin:hyprbars:title_color 
			#windowrulev2 = plugin:hyprbars:title_color rgba(0b0b1200), focus:1
    }
}

$mod = SUPER # Sets "Windows" key as main modifier

#kill temporary apps with esc
bindn = , escape, exec, pkill pavucontrol ; pkill nm-applet ; pkill wofi

bind = $mod ,SLASH , exec, $terminal -e tmux a -t term
bind = $mod ,z , exec, hyprpm disable hyprbars

#screenshots
bind = ,print, exec, grim - | wl-copy
bind = $mod SHIFT, S, exec, grim -g "$(slurp -b 00000050 -c cdd6f4 )" - | wl-copy

#open apps
bind = $mod, Return, exec, $terminal
bind = $mod Alt, Return, exec, [float] $terminal

bind = $mod ,E , exec, $fileManager

bind = CONTROLALT, DELETE, exec, $powermenu
bind = $mod, D, exec, $menu

#manage windows
bind = $mod Alt, Q, killactive,
bind = Alt, F4, killactive,

bind = $mod Alt, F, fullscreen, 0
bind = $mod, F, fullscreen, 1
bind = $mod, W, togglefloating,
bind = $mod, P, pseudo, # dwindle
bind = $mod, V, togglesplit, # dwindle
bind = $mod, T, togglegroup

bind = $mod Alt, h, swapwindow, l
bind = $mod Alt, j, swapwindow, d
bind = $mod Alt, k, swapwindow, u
bind = $mod Alt, l, swapwindow, r

#window navigation
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = alt, tab, cyclenext

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod Alt, 1, movetoworkspace, 1
bind = $mod Alt, 2, movetoworkspace, 2
bind = $mod Alt, 3, movetoworkspace, 3
bind = $mod Alt, 4, movetoworkspace, 4
bind = $mod Alt, 5, movetoworkspace, 5
bind = $mod Alt, 6, movetoworkspace, 6
bind = $mod Alt, 7, movetoworkspace, 7
bind = $mod Alt, 8, movetoworkspace, 8
bind = $mod Alt, 9, movetoworkspace, 9
bind = $mod Alt, 0, movetoworkspace, 10

#bind = $mod SHIFT, x, exec hyprctl dispatch exec floating:movetoworkspace special

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod Alt, s, movetoworkspace, special:magic

#move window by dragging more than 10px or float it by clicking
binds {
    drag_threshold = 10
}
bindm = $mod, mouse:272, movewindow
bindc = $mod, mouse:272, togglefloating

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod Alt, mouse:272, resizewindow
bindm = $mod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-sink-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
